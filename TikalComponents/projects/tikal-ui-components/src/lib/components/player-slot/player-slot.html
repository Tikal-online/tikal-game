<ng-container *transloco="let t; prefix: 'player-slot'">
  <div class="main-group">
    <span class="dot" [style.background-color]="colour() | enumMap: colourMap"></span>
    <p>
      {{ name() }}
      @if (isMe()) {
        <span class="me">({{ t('you') }})</span>
      }
    </p>
    @if (isOwner()) {
      <svg aria-label="crown" color="var(--p-yellow-600)" data-p-icon="crown" [size]="20"></svg>
    }
  </div>
  @if (isReady()) {
    <p class="ready">
      <svg aria-hidden="true" data-p-icon="check" [size]="14"></svg>
      {{ t('ready') }}
    </p>
  } @else {
    <p class="not-ready">{{ t('not-ready') }}</p>
  }
</ng-container>
