<ng-container *transloco="let t; prefix: 'player-slot'">
  <div class="main-group">
    <span class="dot" [style.background-color]="colour() | enumMap: colourMap"></span>
    <p>{{ name() }}</p>
    @if (isOwner()) {
      <i class="pi pi-crown" style="color: var(--p-yellow-600)"></i>
    }
  </div>
  @if (isReady()) {
    <p class="ready">{{ t('ready') }}</p>
  } @else {
    <p class="not-ready">{{ t('not-ready') }}</p>
  }
</ng-container>
