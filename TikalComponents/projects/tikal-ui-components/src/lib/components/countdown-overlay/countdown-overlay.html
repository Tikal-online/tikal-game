<ng-container *transloco="let t; prefix: 'countdown-overlay'">
  @if (secondsLeft() > 0) {
    <span class="label">{{ t('starts-in') }}</span>
    <span class="number" [class.odd]="secondsLeft() % 2 === 1">{{ secondsLeft() }}</span>
  } @else {
    <span class="starting">{{ t('starting') }}</span>
  }
</ng-container>
