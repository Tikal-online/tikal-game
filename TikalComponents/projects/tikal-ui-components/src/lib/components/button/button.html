<button
  pButton
  type="button"
  [iconOnly]="!label()"
  [outlined]="colour() && colour() === 'secondary'"
  [severity]="colour()"
  [size]="size() | enumMap: sizeMap"
>
  @if (isLoading()) {
    <svg data-p-icon="spinner" [spin]="true"></svg>
  } @else if (icon()) {
    <svg [pIcon]="icon()"></svg>
  }
  {{ label() }}
</button>
