<p-button
  [attr.form]="form()"
  [disabled]="isLoading()"
  [icon]="'pi pi-' + icon()"
  [label]="label()"
  [loading]="isLoading()"
  [outlined]="outline()"
  [severity]="colour()"
  [size]="size() | enumMap: sizeMap"
  [type]="type()"
  [variant]="text() ? 'text' : undefined"
  (click)="clicked.emit()"
/>
