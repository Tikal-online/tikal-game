<button
  pButton
  [attr.form]="form()"
  [disabled]="isLoading()"
  [outlined]="outline()"
  [severity]="colour()"
  [size]="size() | enumMap: sizeMap"
  [type]="type()"
  (click)="clicked.emit()"
>
  @if (isLoading()) {
    <i class="pi pi-spin pi-spinner"></i>
  } @else if (icon()) {}
  {{ label() }}
</button>
