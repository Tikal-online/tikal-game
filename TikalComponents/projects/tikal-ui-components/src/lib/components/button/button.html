<button
  pButton
  type="button"
  [disabled]="isLoading()"
  [iconOnly]="!label()"
  [outlined]="outline()"
  [severity]="colour()"
  [size]="size() | enumMap: sizeMap"
  (click)="clicked.emit()"
>
  @if (isLoading()) {
    <svg data-p-icon="spinner" [spin]="true"></svg>
  } @else if (icon()) {
    <svg [pIcon]="icon()"></svg>
  }
  {{ label() }}
</button>
