---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Push Image

on:
  workflow_call:
    inputs:
      dockerfile:
        required: true
        type: string
      version:
        required: true
        type: string
      project-name:
        required: true
        type: string

jobs:
  deploy-release:
    name: Push Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.project-name }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}

      - name: Build and Push Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Set output for Git short SHA
        id: git-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger update workflow in the manifests repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP: ${{ inputs.project-name }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.project-name }}:${{ inputs.version }}
          SHA: ${{ steps.git-sha.outputs.sha }}
        with:
          github-token: ${{ secrets.INFRASTRUCTURE_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Tikal-online',
              repo: 'tikal-infrastructure',
              workflow_id: 'update-container-image.yaml',
              ref: 'main',
              inputs: {
                application: process.env.APP,
                image: process.env.IMAGE,
                sha: process.env.SHA
              }
            })
