<p-dialog
  header="Choose a name"
  [closable]="false"
  [modal]="true"
  [style]="{ width: '24rem' }"
  [visible]="true"
>
  <p>This name will be displayed to other players. It can be changed later</p>
  <form [formRoot]="accountForm">
    <tikal-input placeholder="Type your name here..." [formField]="accountForm.name" />
  </form>
  <ng-template #footer>
    <tikal-button label="Submit" type="submit" [isLoading]="accountForm().submitting()" />
  </ng-template>
</p-dialog>
