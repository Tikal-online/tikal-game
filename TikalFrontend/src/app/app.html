@if (initializationFailed()) {
  <p>Initialization Failed</p>
} @else {
  <p-sidebar-layout>
    <p-sidebar id="sidebar">
      <p-sidebar-spacer />
      <p-sidebar-aside>
        <p-sidebar-panel>
          <p-sidebar-content>
            <p-sidebar-group>
              <p-sidebar-group-label>Navigation</p-sidebar-group-label>
              <p-sidebar-group-content>
                <p-sidebar-menu>
                  <p-sidebar-menu-item>
                    <button pSidebarMenuButton type="button" [isActive]="true">
                      <svg data-p-icon="home"></svg>
                      <span>Lobbies</span>
                    </button>
                  </p-sidebar-menu-item>
                  <p-sidebar-menu-item>
                    <button pSidebarMenuButton type="button" [isActive]="false">
                      <svg data-p-icon="user"></svg>
                      <span>Profile</span>
                    </button>
                  </p-sidebar-menu-item>
                </p-sidebar-menu>
              </p-sidebar-group-content>
            </p-sidebar-group>
          </p-sidebar-content>
        </p-sidebar-panel>
      </p-sidebar-aside>
    </p-sidebar>
    <p-sidebar-main>
      <header>
        <button pButton pSidebarTrigger severity="secondary" target="sidebar" text type="button">
          <svg data-p-icon="sidebar"></svg>
        </button>
      </header>
      <router-outlet />
    </p-sidebar-main>
  </p-sidebar-layout>
}
