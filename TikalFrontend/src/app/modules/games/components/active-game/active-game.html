<ng-container *transloco="let t; prefix: 'games.active'">
  <div class="board">
    <tikal-game-board
      [canPlacePendingTile]="activeGameStore.canPlaceDrawnTile()"
      [pendingTile]="activeGameStore.rotatedDrawnTile()"
      [tiles]="boardTiles()"
      (hoveredPlaceChange)="activeGameStore.moveDrawnTile($event)"
      (placeClick)="activeGameStore.placeDrawnTile($event)"
      (rotatePendingTile)="activeGameStore.rotateDrawnTile($event)"
    />
    @if (activeGameStore.currentPlayer()?.isMe) {
      <p class="turn">{{ t('my-turn') }}</p>
    }
  </div>
  <aside>
    <h2>{{ t('players-header') }}</h2>
    @if (activeGameStore.game(); as game) {
      <ul>
        @for (player of game.players; track player.userId) {
          <li>
            <tikal-player-card
              [colour]="player.colour"
              [isCurrentTurn]="player.turnPosition === game.currentTurnPosition"
              [isMe]="player.isMe"
              [name]="player.name"
              [points]="player.points"
            />
          </li>
        }
      </ul>
    }
    @if (activeGameStore.turnPhase(); as turnPhase) {
      <tikal-turn-status [turnPhase]="turnPhase" />
    }
    @if (activeGameStore.canEndTurn()) {
      <tikal-button
        type="button"
        [isLoading]="isEndingTurn()"
        [label]="t('end-turn-button-label')"
        (clicked)="endTurn()"
      />
    }
  </aside>
</ng-container>
