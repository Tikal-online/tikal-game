<ng-container *transloco="let t; prefix: 'games.active'">
  <div class="board">
    <tikal-game-board
      [pendingTile]="activeGameStore.rotatedDrawnTile()"
      [tiles]="boardTiles()"
      (rotatePendingTile)="activeGameStore.rotateDrawnTile($event)"
    />
    @if (activeGameStore.currentPlayer()?.isMe) {
      <p class="turn">{{ t('my-turn') }}</p>
    }
  </div>
  <aside>
    <h2>{{ t('players-header') }}</h2>
    @if (activeGameStore.game(); as game) {
      <ul>
        @for (player of game.players; track player.userId) {
          <li>
            <tikal-player-card
              [colour]="player.colour"
              [isCurrentTurn]="player.turnPosition === game.currentTurnPosition"
              [isMe]="player.isMe"
              [name]="player.name"
              [points]="player.points"
            />
          </li>
        }
      </ul>
    }
  </aside>
</ng-container>
