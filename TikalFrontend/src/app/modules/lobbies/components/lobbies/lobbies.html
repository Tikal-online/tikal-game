<tikal-lobbies-header />
<ng-container *transloco="let t; prefix: 'lobbies.list'">
  <p-table
    scrollHeight="flex"
    selectionMode="single"
    [lazy]="true"
    [paginator]="lobbiesSummaryStore.hasMultiplePages()"
    [rows]="lobbiesSummaryStore.filter.pageSize()"
    [rowsPerPageOptions]="[10, 15, 25, 50]"
    [scrollable]="true"
    [showCurrentPageReport]="true"
    [totalRecords]="lobbiesSummaryStore.totalCount()"
    [value]="lobbiesSummaryStore.displayLobbies()"
    (onLazyLoad)="onPageChanged($event)"
  >
    <ng-template #header>
      <tr>
        <th scope="col" style="width: 30%">{{ t('columns.name') }}</th>
        <th scope="col" style="width: 30%">{{ t('columns.players') }}</th>
        <th scope="col" style="width: 20%">{{ t('columns.game-mode') }}</th>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3">
          <tikal-lobbies-not-found />
        </td>
      </tr>
    </ng-template>
    <ng-template #body let-lobby>
      @if (lobbiesSummaryStore.isLoading()) {
        <tr>
          <td><tikal-skeleton /></td>
          <td><tikal-skeleton /></td>
          <td><tikal-skeleton /></td>
        </tr>
      } @else {
        <tr [routerLink]="lobby.id">
          <td>{{ lobby.name }}</td>
          <td>
            <tikal-player-count
              [currentPlayers]="lobby.currentPlayers"
              [maxPlayers]="lobby.maxPlayers"
            />
          </td>
          <td><tikal-chip [label]="t('game-modes.standard')" /></td>
        </tr>
      }
    </ng-template>
  </p-table>
</ng-container>
