<ng-container *transloco="let t; prefix: 'lobbies.preview'">
  @if (previewLobbyStore.isLoading()) {
    <h1>{{ t('loading-header') }}</h1>
    <tikal-player-slot-list [isLoading]="true" [maxPlayers]="4" [players]="[]" />
  } @else if (previewLobbyStore.lobby(); as lobby) {
    <h1>{{ lobby.name }}</h1>
    <tikal-player-slot-list [maxPlayers]="lobby.maxPlayers" [players]="lobby.players" />
  }
</ng-container>
